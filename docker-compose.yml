services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lumenza}
      POSTGRES_USER: ${POSTGRES_USER:-lumenza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumenza}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumenza}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./backend
    # daphne (ASGI), not gunicorn/runserver — live voice mode needs a real
    # WebSocket connection (see media_ops/consumers.py), which WSGI
    # (gunicorn) cannot serve at all. Override this service's `command:`
    # locally (e.g. via docker-compose.override.yml) to get runserver's
    # autoreload back for active backend development.
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             daphne -b 0.0.0.0 -p 8000 lumenza.asgi:application"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A lumenza worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    build: ./backend
    # Long-polling for local/dev. Production should point Telegram's
    # setWebhook at bot/views.py instead and drop this service — see
    # bot/management/commands/run_bot_polling.py's help text.
    command: python manage.py run_bot_polling
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      web:
        condition: service_started

  beat:
    build: ./backend
    # Fires CELERY_BEAT_SCHEDULE (currently: billing.renew_subscriptions,
    # daily) — separate process from `worker`, per Celery's own convention;
    # `worker` still executes the task, `beat` only decides when.
    command: celery -A lumenza beat -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Self-hosted sandboxed code execution (code_interpreter app) — the
  # public Piston API (emkc.org) has been whitelist-only since 2026-02-15
  # and excludes paid/commercial products, so this project runs its own
  # instance instead. `--privileged` is required by Piston's own isolation
  # (see their docs) — deliberately NOT publishing a host port, only
  # `web`/`worker` reach it internally via the compose network. Python
  # itself isn't preinstalled — run `docker compose exec web python
  # manage.py setup_piston` once after this service is up.
  piston:
    image: ghcr.io/engineer-man/piston
    privileged: true
    # Piston's own server-side ceiling (default 3000ms/unlimited memory) —
    # a per-request run_timeout/run_memory_limit above this is rejected
    # with a 400, so these must stay >= code_interpreter/piston_adapter.py's
    # RUN_TIMEOUT_MS/RUN_MEMORY_LIMIT_BYTES constants.
    environment:
      PISTON_RUN_TIMEOUT: "10000"
      PISTON_RUN_CPU_TIME: "10000"
      PISTON_RUN_MEMORY_LIMIT: "134217728"
    volumes:
      - piston_data:/piston

volumes:
  postgres_data:
  piston_data:
