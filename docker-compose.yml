services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lumenza}
      POSTGRES_USER: ${POSTGRES_USER:-lumenza}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lumenza}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lumenza}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: ./backend
    # gunicorn, not runserver — a dev-only single-threaded server was never
    # meant to hold up under real concurrent traffic. Override this
    # service's `command:` locally (e.g. via docker-compose.override.yml)
    # to get runserver's autoreload back for active backend development.
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn lumenza.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: celery -A lumenza worker -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  bot:
    build: ./backend
    # Long-polling for local/dev. Production should point Telegram's
    # setWebhook at bot/views.py instead and drop this service — see
    # bot/management/commands/run_bot_polling.py's help text.
    command: python manage.py run_bot_polling
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      web:
        condition: service_started

  beat:
    build: ./backend
    # Fires CELERY_BEAT_SCHEDULE (currently: billing.renew_subscriptions,
    # daily) — separate process from `worker`, per Celery's own convention;
    # `worker` still executes the task, `beat` only decides when.
    command: celery -A lumenza beat -l info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
